plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "1.7.2-SNAPSHOT"
    id "xyz.jpenilla.run-paper" version "2.3.0"

    id "io.freefair.lombok" version "6.2.0"
    id "com.github.johnrengelman.shadow" version "7.1.2"

    // kotlin
    id 'org.jetbrains.kotlin.jvm' version '1.9.20'
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = "https://maven.pkg.github.com/theTd/tclite"
        mavenContent {
            includeModule("com.mineclay", "tclite")
            includeGroup("com.mineclay.tclite")
        }
        credentials {
            username = "$gprUser"
            password = "$gprKey"
        }
    }
}

dependencies {
    paperweight.paperDevBundle("1.18.2-R0.1-SNAPSHOT")
    implementation("org.jooq:joor-java-8:0.9.15")
    implementation("xyz.jpenilla:reflection-remapper:0.1.1")
    implementation("com.mineclay:tclite:1.8.0-SNAPSHOT") {
        exclude(group: "com.github.cryptomorin")
    }
//    compileOnly "io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT"
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
    withSourcesJar()
}

kotlin {
    sourceSets {
        main {
            kotlin.srcDir("src/main/java")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("assemble").configure {
    dependsOn("reobfJar")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
